{{- if not .Values.existingSecret }}
{{- $name := include "kvui.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kvui.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # TOTP secrets are encrypted with this key
type: Opaque
data:
  {{- if $existing }}
  secret-key: {{ index $existing.data "secret-key" }}
  {{- else }}
  # randBytes already returns base64; encode again for the data field.
  secret-key: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
